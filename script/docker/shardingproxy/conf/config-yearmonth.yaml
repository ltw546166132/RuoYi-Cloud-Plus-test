rules:
- !SHARDING
 tables: # 数据分片规则配置
   t_order: # 订单逻辑表名称
     actualDataNodes: ds_0.t_order_$->{2025}0$->{1..6}
     tableStrategy: # 分表策略
       standard:
         shardingColumn: year, month
#         shardingAlgorithmName: t_order_inline
         shardingAlgorithmName: order_groovy_algorithm
     keyGenerateStrategy:
       column: order_id
       keyGeneratorName: snowflake
#      auditStrategy:
#        auditorNames:
#          - sharding_key_required_auditor
#        allowHintDisable: true
 bindingTables:  # 绑定表规则列表
   - t_order
#  defaultDatabaseStrategy:
#    standard:
#      shardingColumn: user_id
#      shardingAlgorithmName: database_user_inline
#  defaultTableStrategy:
#    none:
#  defaultAuditStrategy:
#    auditorNames:
#      - sharding_key_required_auditor
#    allowHintDisable: true

 # 分片算法配置
 shardingAlgorithms:

#   t_order_inline:  # 订单表分片算法名称
#     type: INLINE
#     props:
#       algorithm-expression: t_order_${year}${String.format('%02d', month)}
#       allow-range-query-with-inline-sharding: true

   order_groovy_algorithm:
     type: CLASS_BASED
     props:
       allow-range-query-with-inline-sharding: true
       strategy: STANDARD
       algorithmClassName: org.apache.shardingsphere.sharding.algorithm.sharding.inline.InlineShardingAlgorithm
       algorithm-expression: |
         order_$->{
           def yearStr = year.toString()
           def monthStr = month.toString().padLeft(2, '0')
           return yearStr + monthStr
         }


 # 分布式序列算法配置
 keyGenerators:
   snowflake:
     type: SNOWFLAKE
     props:
       worker-id: 1

